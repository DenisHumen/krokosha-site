      uk: "Щодня збирає нові замовлення з фриланс-майданчика, фільтрує за налаштовуваними правилами й надсилає менеджеру в Telegram на погодження; вивантаження в XLSX, PDF і DOCX та журнал дій."
      ru: "Каждый день собирает новые заказы с фриланс-площадки, фильтрует по настраиваемым правилам и отправляет менеджеру в Telegram на одобрение; выгрузки в XLSX, PDF и DOCX и журнал действий."
