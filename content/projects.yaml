      uk: "Мережа на MikroTik і UniFi, два вузли Proxmox, автоматичне перемикання між інтернет-провайдерами та CRM на власному сервері компанії — з документацією, моніторингом і реєстром успадкованих ризиків."
      ru: "Сеть на MikroTik и UniFi, два узла Proxmox, автоматическое переключение между интернет-провайдерами и CRM на собственном сервере компании — с документацией, мониторингом и реестром унаследованных рисков."
    tags: [MikroTik, UniFi, Proxmox, vlb]
    note: NDA
  - title:
