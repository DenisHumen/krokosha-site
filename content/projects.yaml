      ru: "Интернет-магазин для fashion-бренда"
    description:
      en: "A Shopify store built from a 44-screen Figma design, with the whole setup scripted through the Admin API: 146 products, 31 collections, pages and shipping are restored in one run."
      uk: "Магазин на Shopify за 44-екранним макетом Figma; уся настройка — скриптами через Admin API: 146 товарів, 31 колекція, сторінки й доставка відновлюються за один запуск."
      ru: "Магазин на Shopify по 44-экранному макету Figma; вся настройка — скриптами через Admin API: 146 товаров, 31 коллекция, страницы и доставка восстанавливаются за один запуск."
    tags: [Shopify, Liquid, Admin API, Node.js]
    note: NDA
  - title:
      en: "Order sourcing for a design studio"
      uk: "Пошук замовлень для дизайн-студії"
      ru: "Поиск заказов для дизайн-студии"
    description:
