      uk: "Збирає токени та нативні монети із сотень гаманців в один, закриває DeFi-позиції та обмінює через Relay і LI.FI. Переказ — лише якщо він вигідний після комісій; кожне котирування перевіряється перед підписом."
      ru: "Собирает токены и нативные монеты с сотен кошельков в один, закрывает DeFi-позиции и обменивает через Relay и LI.FI. Перевод — только если он выгоден после комиссий; каждая котировка проверяется перед подписью."
