# Блок «Проекты».
# Публичные репозитории подтягиваются из GitHub автоматически (sync каждые 6 ч).
# Решение Дениса (2026-09-18): показываем ВСЕ публичные репозитории, чтобы было видно количество,
# но проработанные — крупнее и выше. Уровень карточки (tier) считается автоматически, формула — docs/contract.md.
#
#   featured — крупная карточка вверху
#   standard — обычная карточка
#   compact  — строка в компактном списке «Все репозитории»

# Закреплённые: всегда featured и всегда первыми, в этом порядке.
# Подсказка: по формуле The-Blackwall (сетевая безопасность, самое близкое к профилю) сейчас только standard —
# если он важен для образа, добавьте его сюда.
# Автоматизация бизнеса и Web3 — главные проекты по позиционированию (2026-10-02).
pinned:
  - ETHmachine
  - OpenCRM

# Не показывать вообще. Профильный репозиторий DenisHumen исключается всегда.
exclude:
  - DenisHumen

# Ручные правки поверх данных GitHub (необязательно).
# tier — принудительный уровень; description — своё описание вместо GitHub/README.
overrides: {}
#  toolkit:
#    description: "…"
#  Logo:
#    tier: compact

# Архивные репозитории показываются с меткой «архив» и всегда в compact.
show_archived: true

# Ссылки homepage, ведущие на эти домены, не считаются сайтом проекта и не показываются.
# (У 9 репозиториев в homepage стоит t.me/DenisHumen.)
homepage_ignore_hosts:
  - t.me
  - telegram.me
  - github.com

# Коммерческие и приватные проекты — карточки без ссылок.
# TODO(Денис): заполнить реальными проектами. Структура одного проекта
# (title и description — словарь { en, uk, ru }, как в site.yaml):
#   title: короткое название (можно обезличенное: «Сеть для логистической компании»)
#   description: 1–2 предложения — задача и результат
#   tags: [технологии]
#   note: NDA | private | internal
private_projects:
  - title:
      en: "Stable link for a trading workstation"
      uk: "Стабільний канал для торгової станції"
      ru: "Стабильный канал для торговой станции"
    description:
      en: "Traced market-data drop-outs to packet loss on a transit route and moved the feed into a WireGuard split tunnel via a VPS, with a self-healing watchdog. Disconnects fell from 16 in 20 hours to 0–1 a day, packet loss from 13–27% to 0%."
      uk: "Знайшов причину обривів потоку біржових даних — втрати пакетів на транзитному маршруті — і перевів потік у WireGuard-тунель через VPS зі сторожовим таймером. Обриви: з 16 за 20 годин до 0–1 на день, втрати пакетів: з 13–27% до 0%."
      ru: "Нашёл причину обрывов потока биржевых данных — потери пакетов на транзитном маршруте — и перевёл поток в WireGuard-туннель через VPS со сторожевым таймером. Обрывы: с 16 за 20 часов до 0–1 в день, потери пакетов: с 13–27% до 0%."
    tags: [WireGuard, MikroTik, Windows, VPS]
    note: NDA
  - title:
