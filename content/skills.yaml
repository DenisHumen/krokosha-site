# Дерево навыков: категория → группа → навык.
# confirmed: true  — подтверждено в брифе.
# confirmed: false — добавлено как типичное, ждёт подтверждения Дениса (на сайте скрыто, пока flags.skills.show_unconfirmed = false).
# title / note — строка (одинаково на всех языках) или словарь { en, uk, ru }. note: null — без подписи.
# Весь текст дерева попадает в HTML сразу (SEO), раскрытие только визуальное.
# TODO(Денис): пройтись по confirmed: false и поставить true / удалить.

