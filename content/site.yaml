      ru: "инфраструктура, которая просто работает"
  lead:
    en: "Infrastructure engineer from Ukraine. I design and configure networks, servers and clusters, and automate the routine."
    uk: "Інженер інфраструктури з України. Проєктую та налаштовую мережі, сервери й кластери, автоматизую рутину."
    ru: "Инженер инфраструктуры из Украины. Проектирую и настраиваю сети, серверы и кластеры, автоматизирую рутину."
