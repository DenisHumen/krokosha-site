# Основные данные и тексты сайта. Правится без изменения кода.
# TODO(Денис) — заполнить или подтвердить. «# черновик» — текст написан по брифу, ждёт правки.
#
# Языки: en (основной, адрес /), uk (/uk/), ru (/ru/).
# Любое текстовое поле — либо строка (одинаково на всех языках: MikroTik, GitHub…),
# либо словарь { en: …, uk: …, ru: … }. CI будет проверять, что у словаря заполнены все три языка.
# Плейсхолдеры в фигурных скобках ({years}, {id}, {email}…) подставляет сборка.

profile:
  name: { en: "Denis", uk: "Денис", ru: "Денис" }
  nickname: Krokosha
  role:
    en: "Network & Infrastructure Engineer · DevOps"
    uk: "Мережевий та інфраструктурний інженер · DevOps"
    ru: "Сетевой и инфраструктурный инженер · DevOps"
  location: { en: "Ukraine", uk: "Україна", ru: "Украина" }
  # Дата начала карьеры, формат YYYY-MM-DD. Стаж = полные годы от этой даты, считается при каждой сборке
  # (таймер каждые 6 ч), поэтому число растёт само в день годовщины: 2026-09-17 → 8, 2026-09-18 → 9.
  career_start: "2017-09-18"
  avatar_source: https://github.com/DenisHumen.png   # скачивается при sync, раздаётся локально в AVIF/WebP
  avatar_alt: { en: "Denis (Krokosha)", uk: "Денис (Krokosha)", ru: "Денис (Krokosha)" }

github:
  user: DenisHumen

timezone: Europe/Kyiv

i18n:
  default: en
  locales:
    - { code: en, label: "EN", path: "/" }
    - { code: uk, label: "UA", path: "/uk/" }
    - { code: ru, label: "RU", path: "/ru/" }

# Формы множественного числа (правила CLDR): en — [one, other]; uk, ru — [one, few, many].
# Сборка выбирает форму по числу: 1 рік / 2 роки / 8 років.
plurals:
  years:
    en: [year, years]
    uk: [рік, роки, років]
    ru: [год, года, лет]
  public_projects:
    en: [public project, public projects]
    uk: [публічний проєкт, публічні проєкти, публічних проєктів]
    ru: [публичный проект, публичных проекта, публичных проектов]

socials:
  - id: telegram
    label: Telegram
    url: https://t.me/DenisHumen
    primary: true
  - id: email
    label: { en: "Email", uk: "Пошта", ru: "Почта" }
    url: mailto:denis@krokosha.xyz
    primary: true
  - id: github
    label: GitHub
    url: https://github.com/DenisHumen
  # Другие соцсети (LinkedIn / Upwork / X…) — добавить сюда

nav:
  - { number: "01", anchor: services, label: { en: "Services", uk: "Послуги", ru: "Услуги" } }
  - { number: "02", anchor: skills,   label: { en: "Skills",   uk: "Навички", ru: "Навыки" } }
  - { number: "03", anchor: projects, label: { en: "Projects", uk: "Проєкти", ru: "Проекты" } }
  - { number: "04", anchor: contacts, label: { en: "Contact",  uk: "Контакти", ru: "Контакты" } }

hero:                                   # черновик
  headline:
    muted:
      en: "Networks, servers, DevOps —"
      uk: "Мережі, сервери, DevOps —"
      ru: "Сети, серверы, DevOps —"
    strong:
      en: "infrastructure that just works"
      uk: "інфраструктура, яка просто працює"
      ru: "инфраструктура, которая просто работает"
  lead:
    en: "Infrastructure engineer from Ukraine. I design and configure networks, servers and clusters, and automate the routine."
    uk: "Інженер інфраструктури з України. Проєктую та налаштовую мережі, сервери й кластери, автоматизую рутину."
    ru: "Инженер инфраструктуры из Украины. Проектирую и настраиваю сети, серверы и кластеры, автоматизирую рутину."
  # Выводится рядом с числом: «8+ years in infrastructure». {years} — слово из plurals.years в нужной форме.
  experience_label:
    en: "{years} in infrastructure"
    uk: "{years} в інфраструктурі"
    ru: "{years} в инфраструктуре"
  captions:
    left:
      en: "Networks · Servers · DevOps"
      uk: "Мережі · Сервери · DevOps"
      ru: "Сети · Серверы · DevOps"
    center:
      en: "I design, build, configure and maintain."
      uk: "Проєктую, збираю, налаштовую та супроводжую."
      ru: "Проектирую, собираю, настраиваю и сопровождаю."
    right: { en: "[Scroll to explore]", uk: "[Гортайте вниз]", ru: "[Листайте вниз]" }
  link_caption: "link up · 10Gbps · full-duplex"   # подпись в момент касания рук (A8)
  cta:
    telegram: { en: "Message on Telegram", uk: "Написати в Telegram", ru: "Написать в Telegram" }
    email:    { en: "Email", uk: "Пошта", ru: "Почта" }
    discuss:  { en: "Discuss a project", uk: "Обговорити проєкт", ru: "Обсудить проект" }

# Секция «Что я делаю». id — якоря для рекламных объявлений (B7): /#networks, /#servers, /#devops
services:                               # черновик; в текстах только подтверждённые навыки
  - id: networks
    number: "01"
    title: { en: "Networks & network hardware", uk: "Мережі та мережеве обладнання", ru: "Сети и сетевое оборудование" }
    subtitle: "MikroTik · Cisco"
    text:
      en: "Router and switch configuration, building and rebuilding networks for offices and sites."
      uk: "Налаштування маршрутизаторів і комутаторів, побудова та перебудова мереж для офісів і об'єктів."
      ru: "Настройка маршрутизаторов и коммутаторов, построение и перестройка сетей для офисов и объектов."
  - id: servers
    number: "02"
    title: { en: "Servers, storage & clusters", uk: "Сервери, СЗД і кластери", ru: "Серверы, СХД и кластеры" }
    subtitle: { en: "Build · diagnostics · RAID", uk: "Збирання · діагностика · RAID", ru: "Сборка · диагностика · RAID" }
    text:
      en: "Selecting, building and configuring servers and storage systems, complex cluster systems."
      uk: "Підбір, збирання та налаштування серверів і систем зберігання даних, складні кластерні системи."
      ru: "Подбор, сборка и настройка серверов и систем хранения данных, сложные кластерные системы."
  - id: devops
    number: "03"
    title: { en: "DevOps & containers", uk: "DevOps і контейнери", ru: "DevOps и контейнеры" }
    subtitle: "Docker · Kubernetes · Nginx · F5 BIG-IP"
    text:
      en: "Containerization, orchestration, load balancing and web server configuration."
      uk: "Контейнеризація, оркестрація, балансування навантаження та налаштування вебсерверів."
      ru: "Контейнеризация, оркестрация, балансировка нагрузки и настройка веб-серверов."
  - id: highload-lan
    number: "04"
    title: { en: "High-load LANs", uk: "Високонавантажені локальні мережі", ru: "Высоконагруженные ЛВС" }
    subtitle: { en: "Design · high-speed networks", uk: "Проєктування · швидкісні мережі", ru: "Проектирование · скоростные сети" }
    text:
      en: "Designing local networks for heavy load and high data rates."
      uk: "Проєктування локальних мереж під високе навантаження та великі швидкості передачі даних."
      ru: "Проектирование локальных сетей под высокую нагрузку и большие скорости передачи данных."
  - id: tooling
    number: "05"
    title: { en: "Tooling & development", uk: "Розробка інструментів", ru: "Разработка инструментов" }
    subtitle: "Python · Rust · TypeScript · Shell"
    text:
      en: "In-house utilities and automation for infrastructure tasks."
      uk: "Власні утиліти та автоматизація під задачі інфраструктури."
      ru: "Собственные утилиты и автоматизация под задачи инфраструктуры."

stats:                                  # только цифры из данных, без выдуманных метрик
