curtain:                                # тёмная панель-занавес (A9), черновик
  heading:
    en: "Need a network, server or cluster that just works?"
    uk: "Потрібна мережа, сервер чи кластер, який просто працює?"
    ru: "Нужна сеть, сервер или кластер, который просто работает?"
  text:
