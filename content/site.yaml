contacts:
  heading: { en: "Contact", uk: "Контакти", ru: "Контакты" }
  text:                                 # черновик
    en: "Telegram is the fastest. For a task with details, use the form below."
    uk: "Найшвидше — в Telegram. Для задачі з деталями — форма нижче."
    ru: "Быстрее всего — в Telegram. Для задачи с деталями — форма ниже."
  form:
    enabled: true
    attachments: false                  # B10.1: вложения выключены по умолчанию
