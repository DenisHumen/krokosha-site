  no_data: { en: "The map data is not ready yet.", uk: "Дані карти ще не готові.", ru: "Данные карты ещё не готовы." }
  about:
    heading: { en: "How it works", uk: "Як це працює", ru: "Как это работает" }
    paragraphs:
      - en: "The internet is some 80 thousand autonomous systems — providers, hosting, clouds, companies — and each decides whom to connect to and whose traffic to carry. They tell each other about it with BGP. Collectors that many networks talk BGP to keep their tables open: from them, from CAIDA's research into the kinds of links and from PeeringDB, where networks tell where they can be met, the map is rebuilt every night. Only what changed is written: new links, and links that went away."
        uk: "Інтернет — це близько 80 тисяч автономних систем: провайдери, хостинги, хмари, компанії. Кожна сама вирішує, з ким з'єднатися і чий трафік везти, і повідомляє про це іншим через BGP. Колектори, з якими говорять BGP багато мереж, відкривають свої таблиці: з них, з дослідження CAIDA про типи зв'язків і з PeeringDB, де мережі пишуть, де їх можна зустріти, карта будується щоночі. Записується лише те, що змінилося: нові зв'язки і ті, що зникли."
        ru: "Интернет — это около 80 тысяч автономных систем: провайдеры, хостинги, облака, компании. Каждая сама решает, с кем соединиться и чей трафик везти, и сообщает об этом другим через BGP. Коллекторы, с которыми говорят BGP многие сети, открывают свои таблицы: из них, из исследования CAIDA о типах связей и из PeeringDB, где сети пишут, где их можно встретить, карта строится каждую ночь. Записывается только то, что изменилось: новые связи и пропавшие."
      - en: "A route is the chain of networks their policies make likely: a network would rather hand traffic to a customer, who pays, than to a peer, and to a peer rather than to its own provider. Where two networks meet is seen from the exchange points and data centres they share. The delay is estimated from the distance: light in fibre covers about 200 km in a millisecond, and cables are longer than straight lines."
        uk: "Маршрут — ланцюжок мереж, який роблять імовірним їхні правила: мережа охочіше віддає трафік клієнту, що платить, ніж піру, а піру — охочіше, ніж власному провайдеру. Де мережі стикуються, видно зі спільних точок обміну та дата-центрів. Затримку оцінено за відстанню: світло в оптиці проходить близько 200 км за мілісекунду, а кабелі довші за прямі."
        ru: "Маршрут — цепочка сетей, которую делают вероятной их правила: сеть охотнее отдаёт трафик клиенту, который платит, чем пиру, а пиру — охотнее, чем собственному провайдеру. Где сети стыкуются, видно по общим точкам обмена и дата-центрам. Задержка оценена по расстоянию: свет в оптике проходит около 200 км за миллисекунду, а кабели длиннее прямых."
      - en: "Real routers may choose another way, and loss can only be measured. Measurements are coming: traceroute from this site's server and, through RIPE Atlas, from a probe in the sender's own network."
        uk: "Реальні роутери можуть обрати інший шлях, а втрати можна лише виміряти. Скоро тут будуть виміри: traceroute із сервера сайту і, через RIPE Atlas, — із зонда в мережі відправника."
        ru: "Настоящие роутеры могут выбрать другой путь, а потери можно только измерить. Скоро здесь будут замеры: traceroute с сервера сайта и, через RIPE Atlas, — с зонда в сети отправителя."
