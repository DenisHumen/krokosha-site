# Секция «Что я делаю». id — якоря для рекламных объявлений (B7): /#networks, /#servers, /#devops
services:                               # черновик; в текстах только подтверждённые навыки
  - id: networks
    number: "01"
    title: { en: "Networks & network hardware", uk: "Мережі та мережеве обладнання", ru: "Сети и сетевое оборудование" }
    subtitle: "Cisco · Arista · Juniper · Extreme · Fortinet · MikroTik · Ubiquiti"
    text:
      en: "Router and switch configuration, building and rebuilding networks for offices and sites."
      uk: "Налаштування маршрутизаторів і комутаторів, побудова та перебудова мереж для офісів і об'єктів."
      ru: "Настройка маршрутизаторов и коммутаторов, построение и перестройка сетей для офисов и объектов."
  - id: servers
    number: "02"
    title: { en: "Servers, storage & clusters", uk: "Сервери, СЗД і кластери", ru: "Серверы, СХД и кластеры" }
    subtitle: "Dell · HPE · Supermicro · Fujitsu"
    text:
      en: "Selecting, building and configuring servers and storage systems, complex cluster systems."
      uk: "Підбір, збирання та налаштування серверів і систем зберігання даних, складні кластерні системи."
      ru: "Подбор, сборка и настройка серверов и систем хранения данных, сложные кластерные системы."
  - id: devops
    number: "03"
    title: { en: "DevOps & containers", uk: "DevOps і контейнери", ru: "DevOps и контейнеры" }
    subtitle: "Docker · Kubernetes · Nginx · F5 BIG-IP"
    text:
      en: "Containerization, orchestration, load balancing and web server configuration."
      uk: "Контейнеризація, оркестрація, балансування навантаження та налаштування вебсерверів."
      ru: "Контейнеризация, оркестрация, балансировка нагрузки и настройка веб-серверов."
  - id: highload-lan
    number: "04"
    title: { en: "High-load LANs", uk: "Високонавантажені локальні мережі", ru: "Высоконагруженные ЛВС" }
    subtitle: { en: "Design · high-speed networks", uk: "Проєктування · швидкісні мережі", ru: "Проектирование · скоростные сети" }
    text:
      en: "Designing local networks for heavy load and high data rates."
      uk: "Проєктування локальних мереж під високе навантаження та великі швидкості передачі даних."
      ru: "Проектирование локальных сетей под высокую нагрузку и большие скорости передачи данных."
  - id: tooling
    number: "05"
    title: { en: "Tooling & development", uk: "Розробка інструментів", ru: "Разработка инструментов" }
    subtitle: "Python · Rust · TypeScript · Shell"
    text:
      en: "In-house utilities and automation for infrastructure tasks."
      uk: "Власні утиліти та автоматизація під задачі інфраструктури."
      ru: "Собственные утилиты и автоматизация под задачи инфраструктуры."

