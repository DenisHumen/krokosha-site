# Основные данные и тексты сайта. Правится без изменения кода.
# TODO(Денис) — заполнить или подтвердить. «# черновик» — текст написан по брифу, ждёт правки.
#
# Языки: en (основной, адрес /), uk (/uk/), ru (/ru/).
# Любое текстовое поле — либо строка (одинаково на всех языках: MikroTik, GitHub…),
# либо словарь { en: …, uk: …, ru: … }. CI будет проверять, что у словаря заполнены все три языка.
# Плейсхолдеры в фигурных скобках ({years}, {id}, {email}…) подставляет сборка.

# Адрес сайта: из него строятся canonical, hreflang, sitemap.xml и Open Graph.
# При установке на другой домен перекрывается переменной окружения SITE_URL.
url: https://krokosha.com

profile:
  name: { en: "Denis", uk: "Денис", ru: "Денис" }
  nickname: Krokosha
  role:
    en: "Network & Infrastructure Engineer · DevOps"
    uk: "Мережевий та інфраструктурний інженер · DevOps"
    ru: "Сетевой и инфраструктурный инженер · DevOps"
  location: { en: "Ukraine", uk: "Україна", ru: "Украина" }
  # Дата начала карьеры, формат YYYY-MM-DD. Стаж = полные годы от этой даты, считается при каждой сборке
  # (таймер каждые 6 ч), поэтому число растёт само в день годовщины: 2026-09-17 → 8, 2026-09-18 → 9.
  career_start: "2017-09-18"
  avatar_source: https://github.com/DenisHumen.png   # скачивается при sync, раздаётся локально в AVIF/WebP
  avatar_alt: { en: "Denis (Krokosha)", uk: "Денис (Krokosha)", ru: "Денис (Krokosha)" }

github:
  user: DenisHumen

timezone: Europe/Kyiv

i18n:
  default: en
  locales:
    - { code: en, label: "EN", path: "/" }
    - { code: uk, label: "UA", path: "/uk/" }
    - { code: ru, label: "RU", path: "/ru/" }

# Формы множественного числа (правила CLDR): en — [one, other]; uk, ru — [one, few, many].
# Сборка выбирает форму по числу: 1 рік / 2 роки / 8 років.
plurals:
  years:
    en: [year, years]
    uk: [рік, роки, років]
    ru: [год, года, лет]
  public_projects:
    en: [public project, public projects]
    uk: [публічний проєкт, публічні проєкти, публічних проєктів]
    ru: [публичный проект, публичных проекта, публичных проектов]
  skills:
    en: [skill, skills]
    uk: [навичка, навички, навичок]
    ru: [навык, навыка, навыков]
  orders:                               # личный кабинет: «ещё 2 заказа до уровня»
    en: [order, orders]
    uk: [замовлення, замовлення, замовлень]
    ru: [заказ, заказа, заказов]

