# Скидки и уровни постоянных клиентов (api/internal/loyalty, docs/architecture.md, 2026-09-24).
# Скидки не суммируются: на заявку ложится наибольшая и фиксируется в ней в момент отправки.
# Уровень — по числу выполненных заказов ИЛИ по их сумме (её вносят в админке, закрывая заказ),
# что наступит раньше; 0 выключает условие. Сервис подхватывает правку без перезапуска.
loyalty:                                # черновик: проценты и пороги правятся здесь
  enabled: true
  currency: USD                         # в чём вносятся суммы заказов
  welcome: 10                           # % на первую заявку — всем
  eggs: 20                              # % на одну заявку — за все найденные пасхалки
