    en: "{years} in infrastructure"
    uk: "{years} в інфраструктурі"
    ru: "{years} в инфраструктуре"
  captions:
    left:
      en: "Networks · Servers · DevOps"
      uk: "Мережі · Сервери · DevOps"
      ru: "Сети · Серверы · DevOps"
    center:
      en: "I design, build, configure and maintain."
      uk: "Проєктую, збираю, налаштовую та супроводжую."
      ru: "Проектирую, собираю, настраиваю и сопровождаю."
    right: { en: "[Scroll to explore]", uk: "[Гортайте вниз]", ru: "[Листайте вниз]" }
  link_caption: "link up · 10Gbps · full-duplex"   # подпись в момент касания рук (A8)
  cta:
    telegram: { en: "Message on Telegram", uk: "Написати в Telegram", ru: "Написать в Telegram" }
    email:    { en: "Email", uk: "Пошта", ru: "Почта" }
