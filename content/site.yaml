# Пасхалки (бриф A6; какие включены — flags.easter_eggs). Команды терминала и строки «BIOS» — на
# английском, как в настоящей консоли; по-человечески сказанное — на языке страницы.
eggs:
  found: { en: "Easter egg found", uk: "Пасхалку знайдено", ru: "Пасхалка найдена" }   # читает экранный диктор перед названием ачивки
  # Найденная пасхалка — ачивка: баннер как в Steam, название и строка описания (до двух строк).
  # all — последняя, за все пасхалки сразу: золотая, как редкая ачивка Steam.
  achievements:
    konami:
      name: "↑↑↓↓←→←→BA"
      text: { en: "Night in the server room: all green", uk: "Ніч у серверній: усе зелене", ru: "Ночь в серверной: всё зелёное" }
    sudo:
      name: { en: "Superuser", uk: "Суперкористувач", ru: "Суперпользователь" }
      text: { en: "Typed sudo and got a terminal", uk: "Набрали sudo — і отримали термінал", ru: "Набрали sudo — и получили терминал" }
    croc:
      name: { en: "Crocodile spotted", uk: "Крокодила помічено", ru: "Крокодил замечен" }
      text: { en: "It was peeking out from behind the footer", uk: "Він визирав з-за футера", ru: "Он выглядывал из-за футера" }
    croc5:
      name: { en: "The real Krokosha", uk: "Справжній Krokosha", ru: "Настоящий Krokosha" }
      text: { en: "Crock-crock! Five clicks on the crocodile", uk: "Крок-крок! П'ять кліків по крокодилу", ru: "Крок-крок! Пять кликов по крокодилу" }
    cat:
      name: { en: "Cat whisperer", uk: "Заклинач котів", ru: "Заклинатель котов" }
      text: { en: "The wandering cat sat down to rest", uk: "Кіт-мандрівник присів відпочити", ru: "Кот-путешественник присел отдохнуть" }
    reboot:
      name: { en: "Turn it off and on again", uk: "Вимкни й увімкни", ru: "Выключи и включи" }
      text: { en: "The avatar rebooted like a server", uk: "Аватар перезавантажився, як сервер", ru: "Аватар перезагрузился, как сервер" }
    console:
      name: { en: "Almost a colleague", uk: "Майже колега", ru: "Почти коллега" }
      text: { en: "krokosha.hello() in the DevTools console", uk: "krokosha.hello() у консолі DevTools", ru: "krokosha.hello() в консоли DevTools" }
    lost_packet:
      name: { en: "Packet recovered", uk: "Пакет знайдено", ru: "Пакет найден" }
      text: { en: "The lost packet of the 404 page", uk: "Загублений пакет зі сторінки 404", ru: "Потерянный пакет со страницы 404" }
    all:
      name: "root@krokosha"
      text: { en: "Every easter egg found", uk: "Знайдено всі пасхалки", ru: "Найдены все пасхалки" }
  # Редкость, как в Steam: доля игроков, нашедших ачивку (api/internal/achievements: пересчёт раз в
  # 5 минут; пока игроков меньше 10, её не видно). Реже 10 % — редкая, золотая. {percent} — «3,4 %».
  rarity: { en: "{percent} of players have it", uk: "Є в {percent} гравців", ru: "Есть у {percent} игроков" }
  panel:                                # панель ачивок: открывается счётчиком «eggs 3/8»
    title: { en: "Achievements", uk: "Досягнення", ru: "Достижения" }
    open: { en: "Achievements: {found} of {total}", uk: "Досягнення: {found} з {total}", ru: "Достижения: {found} из {total}" }
    progress: { en: "{found} of {total}", uk: "{found} з {total}", ru: "{found} из {total}" }
    locked: { en: "Not found yet", uk: "Ще не знайдено", ru: "Ещё не найдено" }
    found_on: { en: "Found {date}", uk: "Знайдено {date}", ru: "Найдено {date}" }
    rare: { en: "Rare", uk: "Рідкісне", ru: "Редкое" }
    counting:
      en: "Rarity appears once enough players are counted."
      uk: "Рідкість з'явиться, щойно гравців набереться достатньо."
      ru: "Редкость появится, когда наберётся достаточно игроков."
    discount:
      en: "Find every egg — and get {percent}% off one request."
      uk: "Знайдіть усі пасхалки — і отримайте {percent}% знижки на одну заявку."
      ru: "Найдите все пасхалки — и получите {percent}% скидки на одну заявку."
    discount_ready:
      en: "Every egg is found: {percent}% off your next request. It applies by itself when you send the form from this browser or signed in to your account."
      uk: "Усі пасхалки знайдено: {percent}% знижки на наступну заявку. Вона застосується сама, коли ви надішлете форму з цього браузера або увійшовши в кабінет."
      ru: "Все пасхалки найдены: {percent}% скидки на следующую заявку. Она применится сама, когда вы отправите форму из этого браузера или войдя в кабинет."
    discount_used:
      en: "The discount for the eggs has gone to a request."
      uk: "Знижку за пасхалки вже використано в заявці."
      ru: "Скидка за пасхалки уже использована в заявке."
    account: { en: "Keep them in your account", uk: "Зберегти їх у кабінеті", ru: "Сохранить их в кабинете" }
    close: { en: "Close", uk: "Закрити", ru: "Закрыть" }
  night: { en: "server room · 03:14 · all green", uk: "серверна · 03:14 · усе зелене", ru: "серверная · 03:14 · всё зелёное" }
  croc: { en: "Crocodile", uk: "Крокодил", ru: "Крокодил" }
  console:
    en: "Reading the console? Almost a colleague already. krokosha.hello() · or type sudo on the page · or ↑↑↓↓←→←→BA"
    uk: "Хто читає консоль — той уже майже колега. krokosha.hello() · або наберіть sudo на сторінці · або ↑↑↓↓←→←→BA"
    ru: "Кто читает консоль — тот уже почти коллега. krokosha.hello() · или наберите sudo на странице · или ↑↑↓↓←→←→BA"
  terminal:
    whoami: { en: "guest (but curious). Denis is root here.", uk: "guest (але допитливий). root тут — Денис.", ru: "guest (но любопытный). root здесь — Денис." }
    uptime: { en: "up {years}, 0 incidents caused by coffee", uk: "up {years}, 0 інцидентів через каву", ru: "up {years}, 0 инцидентов из-за кофе" }
    ping: { en: "he answers fast", uk: "він відповідає швидко", ru: "он отвечает быстро" }
    rm: { en: "nice try. Snapshot restored in 0.2 s", uk: "гарна спроба. Знімок відновлено за 0.2 с", ru: "хорошая попытка. Снапшот восстановлен за 0.2 с" }

# Личный кабинет клиента: /account/ (api/internal/clients, docs/architecture.md, 2026-09-24).
# Заявки и обращения, их статусы и переписка, скидка и уровень, контакты и соцсети, устройства.
# Вход без пароля: одноразовый код на почту или от Telegram-бота. {…} — подставляет скрипт страницы.
account:
  title: { en: "Personal account", uk: "Особистий кабінет", ru: "Личный кабинет" }
  description:
    en: "Your requests and inquiries, their statuses and answers, your discount and client level."
    uk: "Ваші заявки й звернення, їхні статуси та відповіді, ваша знижка й рівень клієнта."
    ru: "Ваши заявки и обращения, их статусы и ответы, ваша скидка и уровень клиента."
  link: { en: "Personal account", uk: "Особистий кабінет", ru: "Личный кабинет" }   # кнопка в шапке
  no_script:
    en: "The personal account needs JavaScript. A request can be sent without it — with the form on the main page."
    uk: "Особистому кабінету потрібен JavaScript. Заявку можна надіслати й без нього — формою на головній."
    ru: "Личному кабинету нужен JavaScript. Заявку можно отправить и без него — формой на главной."
  loading: { en: "Checking the session…", uk: "Перевіряємо сесію…", ru: "Проверяем сессию…" }
  login:
    lead:
      en: "Your requests and inquiries, their statuses and answers, your discount and level. No password: a one-time code comes by email or from the Telegram bot."
      uk: "Ваші заявки й звернення, їхні статуси та відповіді, знижка й рівень. Без пароля: одноразовий код прийде на пошту або від Telegram-бота."
      ru: "Ваши заявки и обращения, их статусы и ответы, скидка и уровень. Без пароля: одноразовый код придёт на почту или от Telegram-бота."
    method: { en: "Sign in with", uk: "Спосіб входу", ru: "Способ входа" }
    email: { en: "Email", uk: "Пошта", ru: "Почта" }
    telegram: "Telegram"
    email_label: { en: "Your email", uk: "Ваша пошта", ru: "Ваша почта" }
    send: { en: "Send the code", uk: "Надіслати код", ru: "Прислать код" }
    telegram_text:
      en: "The site's bot will send you a code for this page."
      uk: "Бот сайту надішле код для цієї сторінки."
      ru: "Бот сайта пришлёт код для этой страницы."
    telegram_open: { en: "Open the bot", uk: "Відкрити бота", ru: "Открыть бота" }
    sent_email:
      en: "The code went to {address}. It is valid for 15 minutes; the letter also has a button that signs you in at once."
      uk: "Код надіслано на {address}. Він діє 15 хвилин; у листі є й кнопка, що одразу впускає."
      ru: "Код отправлен на {address}. Он действует 15 минут; в письме есть и кнопка, которая сразу впускает."
    sent_telegram:
      en: "Press Start in the bot, and it will send the code. The code is valid for 15 minutes."
      uk: "Натисніть Start у боті — і він надішле код. Код діє 15 хвилин."
      ru: "Нажмите Start в боте — и он пришлёт код. Код действует 15 минут."
    code: { en: "Code", uk: "Код", ru: "Код" }
    submit: { en: "Sign in", uk: "Увійти", ru: "Войти" }
    back: { en: "Another way", uk: "Інший спосіб", ru: "Другой способ" }
    link: { en: "Signing you in…", uk: "Входимо…", ru: "Входим…" }
    # Ссылка из письма или от бота сначала спрашивает: чужая ссылка открыла бы чужой кабинет. {account} — «d***s@gmail.com».
    link_ask:
      en: "This link signs in to the account of {account}."
      uk: "Це посилання веде до кабінету {account}."
      ru: "Эта ссылка ведёт в кабинет {account}."
    link_note:
      en: "Sign in only if you asked for the link yourself: a link from somebody else opens their account, and they would see whatever you send from it."
      uk: "Входьте, лише якщо ви самі запитували посилання: чуже посилання відкриває чужий кабінет, і його власник побачить усе, що ви звідти надішлете."
      ru: "Входите, только если вы сами запрашивали ссылку: чужая ссылка открывает чужой кабинет, и его владелец увидит всё, что вы оттуда отправите."
    link_yes: { en: "Sign in", uk: "Увійти", ru: "Войти" }
    link_no: { en: "It is not mine", uk: "Це не моє", ru: "Это не моё" }
    note:
      en: "No account yet? It appears with the first sign-in, and the requests sent earlier from the same email or Telegram join it."
      uk: "Ще немає кабінету? Він з'явиться з першим входом, а заявки, надіслані раніше з тієї ж пошти чи Telegram, приєднаються до нього."
      ru: "Ещё нет кабинета? Он появится при первом входе, а заявки, отправленные раньше с той же почты или Telegram, присоединятся к нему."
  errors:
    bad_email: { en: "Check the email address", uk: "Перевірте адресу пошти", ru: "Проверьте адрес почты" }
    bad_code: { en: "The code does not fit or has expired", uk: "Код не підходить або застарів", ru: "Код не подходит или устарел" }
    throttled: { en: "Too many attempts. Please try again in an hour.", uk: "Забагато спроб. Спробуйте за годину.", ru: "Слишком много попыток. Попробуйте через час." }
    no_bot: { en: "Signing in with Telegram is not available now: please use email.", uk: "Вхід через Telegram зараз недоступний — скористайтеся поштою.", ru: "Вход через Telegram сейчас недоступен — воспользуйтесь почтой." }
    taken: { en: "This email or Telegram belongs to a disabled account. Please write to me.", uk: "Ця пошта чи Telegram належить вимкненому кабінету. Напишіть мені.", ru: "Эта почта или Telegram принадлежит отключённому кабинету. Напишите мне." }
    disabled: { en: "This account is disabled. Please write to me.", uk: "Цей кабінет вимкнено. Напишіть мені.", ru: "Этот кабинет отключён. Напишите мне." }
    signed_out: { en: "The session has ended: please sign in again.", uk: "Сесія завершилася — увійдіть знову.", ru: "Сессия завершилась — войдите снова." }
    bad_contact: { en: "This does not look like a contact of this kind", uk: "Це не схоже на контакт такого типу", ru: "Это не похоже на контакт такого типа" }
    too_many: { en: "No more contacts can be added", uk: "Більше контактів додати не можна", ru: "Больше контактов добавить нельзя" }
    empty: { en: "Write a few words", uk: "Напишіть кілька слів", ru: "Напишите несколько слов" }
    too_long: { en: "No more than 4000 characters", uk: "Не більше 4000 символів", ru: "Не больше 4000 символов" }
    last_way: { en: "Add an email first: without Telegram there would be no way in.", uk: "Спершу додайте пошту: без Telegram не буде як увійти.", ru: "Сначала добавьте почту: без Telegram будет не войти." }
    no_way_back: { en: "Add an email or Telegram first: there is nowhere to answer.", uk: "Спершу додайте пошту або Telegram — нікуди відповісти.", ru: "Сначала добавьте почту или Telegram — некуда ответить." }
    server: { en: "Something went wrong. Please try again a little later.", uk: "Щось пішло не так. Спробуйте трохи згодом.", ru: "Что-то пошло не так. Попробуйте чуть позже." }
