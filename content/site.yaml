# В site.json (данные для дизайна) не попадает.
map:                                    # страница /map — карта интернета (docs/netmap.md)
  title: { en: "Map of the internet", uk: "Карта інтернету", ru: "Карта интернета" }
  status: "/MAP · BGP"
  lead:
    en: "Every network of the internet and the links between them, rebuilt every night from open routing data. Enter two addresses: the map draws the way packets are likely to go — network by network, where they meet and how long it takes."
    uk: "Усі мережі інтернету та зв'язки між ними, щоночі наново з відкритих даних маршрутизації. Введіть дві адреси — карта намалює, яким шляхом, імовірно, підуть пакети: мережа за мережею, де вони стикуються і скільки це займе."
    ru: "Все сети интернета и связи между ними, каждую ночь заново из открытых данных маршрутизации. Введите два адреса — карта нарисует, каким путём, вероятно, пойдут пакеты: сеть за сетью, где они стыкуются и сколько это займёт."
  description:
    en: "An interactive map of the internet: 80 thousand networks, the links between them and the exchange points where they meet. Trace the likely route between any two IP addresses."
    uk: "Інтерактивна карта інтернету: 80 тисяч мереж, зв'язки між ними і точки обміну трафіком. Прокладіть імовірний маршрут між будь-якими двома IP-адресами."
    ru: "Интерактивная карта интернета: 80 тысяч сетей, связи между ними и точки обмена трафиком. Проложите вероятный маршрут между любыми двумя IP-адресами."
