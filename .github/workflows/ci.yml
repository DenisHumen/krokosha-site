name: CI

# Runs on every pull request (main accepts changes only through PRs) and on main itself.
# No path filters on purpose: the jobs are required checks, and a required check that never starts
# would block the PR forever.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (lint, types, tests, build)
    runs-on: ubuntu-24.04 # same OS as the VPS
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      # Actions are pinned to commit SHAs; Dependabot keeps them fresh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: ESLint (TypeScript, Astro, accessibility)
        run: npm run lint

      - name: Types (astro check)
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: mock/ matches content/ (docs/contract.md)
        run: npm run mock:check

      - name: Build
        run: npm run build

      - name: Check the built site
        run: node scripts/check-dist.mjs

  api:
    name: api (lint, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    # The same engines as in production, for the integration tests (api/internal/testenv).
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: krokosha-test
        ports: ["33306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pkrokosha-test --silent"
          --health-interval 5s --health-timeout 5s --health-retries 40
      redis:
        image: redis:8-alpine
        ports: ["36379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      KROKOSHA_TEST_MYSQL: 127.0.0.1:33306
      KROKOSHA_TEST_REDIS: 127.0.0.1:36379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The minimum supported Go version (api/go.mod): what compiles here compiles on the server.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: api

      - name: Tests (with the race detector)
        run: go test -race -count=1 ./...

      # One static binary for the VPS: no libc dependency, reproducible.
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o bin/ ./cmd/...

  deploy:
    name: deploy (shellcheck, install on a clean VM)
    runs-on: ubuntu-24.04 # same OS as the VPS; a real VM with systemd, thrown away after the job
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck
        run: |
          shellcheck --version | sed -n 2p
          shellcheck -x deploy/*.sh deploy/lib/*.sh deploy/bin/* deploy/ci/*.sh

      # The brief's acceptance criterion: a clean server is set up with one command.
      # Installs for a fake domain with a self-signed certificate, then checks the site, headers,
      # firewall (with a WireGuard interface that must survive), a second run, update, rollback
      # and uninstall.
      - name: Install, update, roll back and uninstall on this VM
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sudo mkdir -p /srv/krokosha-src
          sudo cp -a . /srv/krokosha-src/
          sudo chown -R root:root /srv/krokosha-src
          sudo chmod -R a+rX /srv/krokosha-src
          sudo git -C /srv/krokosha-src switch --quiet --create ci-test
          sudo --preserve-env=GITHUB_TOKEN /srv/krokosha-src/deploy/ci/test-install.sh /srv/krokosha-src

  e2e:
    name: web e2e (Playwright, axe, Lighthouse)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # Real browser, desktop and 360 px phone: console errors, CSP violations, WCAG 2.1 AA (axe), themes, languages.
      - name: End-to-end tests
        run: npm run test:e2e

      # Brief B7: Lighthouse >= 95 in every category, LCP < 2.5 s, CLS < 0.1 on mobile.
      # Run through npx with a pinned version: the CLI is heavy and is needed only here.
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-reports
          path: |
            web/playwright-report/
            web/.lighthouseci/reports/
          if-no-files-found: ignore
          retention-days: 14
