<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--inverse-bg);color:var(--inverse-fg);font:400 1rem/1.55 var(--font-sans)}
a{color:inherit;text-decoration:none}a:hover{color:var(--accent)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
h1,h2,h3,p,ul,ol{margin:0}ul,ol{padding:0;list-style:none}
@keyframes kro-up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes kro-blink{50%{opacity:.2}}
@keyframes kro-scan{to{transform:translateY(100vh)}}
</style>
</helmet>
<div data-screen-label="Play (stub)" style="min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;position:relative;overflow:hidden">
<i aria-hidden="true" style="position:absolute;left:0;right:0;top:-2px;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.6;animation:kro-scan 6s linear infinite"></i>
<header style="display:flex;align-items:center;justify-content:space-between;gap:1.5rem;height:3.75rem;padding:0 var(--gutter);border-bottom:1px solid var(--inverse-line)">
  <a href="index.dc.html" data-slot="profile.nickname" style="font-weight:500;letter-spacing:.02em">{{ profile.nickname }}</a>
  <span style="font-family:var(--font-mono);font-size:.7rem;letter-spacing:.14em;color:var(--inverse-muted)">/PLAY · LEVEL 0</span>
</header>
<main style="display:grid;align-content:center;justify-items:center;gap:1.5rem;padding:4rem var(--gutter);text-align:center">
  <div aria-hidden="true" style="display:grid;grid-template-columns:repeat(9,10px);gap:6px;animation:kro-up var(--dur-4) var(--ease-out) both">
    <sc-for list="{{ door }}" as="d" hint-placeholder-count="63"><i style="width:10px;height:10px;border-radius:50%;background:{{ d.c }};opacity:{{ d.o }};animation:{{ d.a }}"></i></sc-for>
  </div>
  <p style="font-family:var(--font-mono);font-size:.72rem;letter-spacing:.14em;color:var(--inverse-muted)">{{ status }}</p>
  <h1 data-slot="site.footer.play_stub" style="font-size:clamp(1.8rem,4vw,3rem);line-height:1.1;letter-spacing:-.03em;font-weight:500;max-width:22ch;text-wrap:balance">{{ site.footer.play_stub }}</h1>
  <a href="index.dc.html" style="display:inline-flex;align-items:center;gap:.6rem;height:3rem;padding:0 1.4rem;border:1px solid var(--inverse-line);border-radius:var(--radius-pill);color:var(--inverse-fg)" style-hover="border-color:var(--inverse-fg);color:var(--inverse-fg)">← {{ site.not_found.back }}</a>
</main>
<footer data-section="footer" style="padding:2rem var(--gutter);border-top:1px solid var(--inverse-line);display:flex;justify-content:space-between;gap:1rem;font-family:var(--font-mono);font-size:.72rem;color:var(--inverse-muted)"><span data-slot="site.footer.copyright">{{ copyright }}</span><span>build: pending · wasd/joystick: —</span></footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;uk&quot;,&quot;ru&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;'ru'|'en'|'uk'&quot;}}">
class Component extends DCLogic {
  state = { data: null, lang: 'en' };
  async componentDidMount() { await this.load(this.props.lang ?? 'en'); }
  componentDidUpdate() { const lang = this.props.lang ?? 'en'; if (lang !== this.propLang) { this.propLang = lang; if (lang !== this.state.lang) this.load(lang); } }
  async load(lang) { this.loading = true; const { loadMock } = await import('./lib/mock-data.js'); const data = await loadMock(lang); this.loading = false; document.documentElement.lang = lang; this.setState({ data, lang }); }
  renderVals() {
    const { data, lang } = this.state; const d = data || {}; const site = d.site || {}; const profile = d.profile || {};
    // a dot-matrix hatch: a door outline with a blinking lock
    const rows = ['#########', '#.......#', '#.......#', '#.......#', '#....o..#', '#.......#', '#########'];
    const door = rows.join('').split('').map((ch, i) => ({ c: ch === 'o' ? 'var(--accent)' : 'var(--inverse-fg)', o: ch === '#' ? 0.9 : ch === 'o' ? 1 : 0.12, a: ch === 'o' ? 'kro-blink 1.4s infinite' : 'none' }));
    return { site, profile, lang, door, status: { ru: 'ЛЮК ЗАКРЫТ · ДОСТУП ПОЗЖЕ', en: 'HATCH SEALED · ACCESS LATER', uk: 'ЛЮК ЗАЧИНЕНО · ДОСТУП ПІЗНІШЕ' }[lang], copyright: String(site.footer?.copyright || '').replace('{year}', new Date().getFullYear()) };
  }
}
</script>
</body>
</html>
