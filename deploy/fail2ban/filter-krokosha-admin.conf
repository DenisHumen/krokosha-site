# Installed as /etc/fail2ban/filter.d/krokosha-admin.conf.
#
# Failed logins to the admin area, read from nginx's log of that area (JSON lines, see
# deploy/nginx/krokosha-http.conf). The API answers a wrong password or one-time code with 401
# and an exhausted attempt budget with 429; both count. So does any other POST answered so: that
# file has the admin area only, and there 401 on a POST means no session. The URI is not looked at:
# it is the raw one ($request_uri), and «/login?x=1» or «/logi%6E» reach the same handler. It is
# matched as a JSON string, escapes included: a «"» in it comes as «\"».
#
# Test after changing:
#   fail2ban-regex /var/log/krokosha/nginx-admin.json.log /etc/fail2ban/filter.d/krokosha-admin.conf

[Definition]
# fail2ban cuts the matched date (the group below) out of the line before it applies failregex,
# hence "time":"[^"]*" rather than a pattern for the date.
datepattern = ^\{"time":"(%%Y-%%m-%%dT%%H:%%M:%%S%%z)"
failregex = ^\{"time":"[^"]*","remote_addr":"<ADDR>","host":"[^"]*","method":"POST","uri":"(?:[^"\\]|\\.)*","protocol":"[^"]*","status":(?:401|429),
ignoreregex =
