# Installed as /etc/fail2ban/jail.d/krokosha.conf.
# SSH accepts keys only, so guessing passwords is pointless — the jail just keeps the noise down.
# Jails for the admin login and the mail server are added together with those services.

[sshd]
enabled = true
backend = systemd
maxretry = 5
findtime = 10m
bantime = 1h
bantime.increment = true
bantime.maxtime = 1w
