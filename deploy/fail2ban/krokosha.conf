# Installed as /etc/fail2ban/jail.d/krokosha.conf.
# SSH accepts keys only, so guessing passwords is pointless — the jail just keeps the noise down.
# The jail for the mail server is added together with that service.

[sshd]
enabled = true
backend = systemd
maxretry = 5
findtime = 10m
bantime = 1h
bantime.increment = true
bantime.maxtime = 1w

# Failed logins to the admin area (filter: filter-krokosha-admin.conf). The ban covers the web
# ports only. Locked yourself out?  sudo fail2ban-client set krokosha-admin unbanip ADDRESS
[krokosha-admin]
enabled = true
filter = krokosha-admin
# Ubuntu and Debian default to the systemd journal; this jail reads a file.
backend = auto
logpath = /var/log/krokosha/nginx-admin.json.log
port = http,https
maxretry = 10
findtime = 15m
bantime = 1h
bantime.increment = true
bantime.maxtime = 1w
