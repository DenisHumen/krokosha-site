# Needs libnginx-mod-http-brotli-filter; install.sh includes this file only when the module is there.
brotli on;
brotli_comp_level 5;
brotli_min_length 256;
brotli_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml application/manifest+json image/svg+xml;
