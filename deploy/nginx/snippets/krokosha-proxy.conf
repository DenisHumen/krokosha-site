# Requests handed to the API on loopback. The API sets its own security headers;
# nginx adds only what depends on the TLS setup.
proxy_pass http://127.0.0.1:8080;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# The API trusts this header because it listens on loopback only (api/internal/server).
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
proxy_read_timeout 30s;
include snippets/krokosha-hsts.conf;
