# Security headers. nginx drops inherited add_header directives as soon as a location defines its
# own, so every location that sets Cache-Control includes this file again.
#
# The page's own Content-Security-Policy (script and style hashes) is a <meta> tag written by the
# Astro build; the header below adds what a <meta> cannot express. Both policies apply together.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
