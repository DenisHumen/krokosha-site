# Shared by the locations of the admin area (site-https.conf.tmpl).
limit_req_status 429;
client_max_body_size 64k;
# A log of its own: the secret path and the owner's clicks stay out of the traffic dashboard,
# and fail2ban watches this file for failed logins (deploy/fail2ban/filter-krokosha-admin.conf).
access_log /var/log/krokosha/nginx-admin.json.log krokosha_json;
include snippets/krokosha-proxy.conf;
