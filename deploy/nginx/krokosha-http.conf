# http-level settings (installed as /etc/nginx/conf.d/krokosha-http.conf).

# Access log as JSON lines: the API reads it incrementally for the «server traffic» dashboard,
# which also sees bots and visitors without JavaScript (brief B6).
log_format krokosha_json escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","host":"$host","method":"$request_method",'
    '"uri":"$request_uri","protocol":"$server_protocol","status":$status,"bytes_sent":$bytes_sent,'
    '"request_time":$request_time,"referer":"$http_referer","user_agent":"$http_user_agent"}';
