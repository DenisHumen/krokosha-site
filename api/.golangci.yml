# golangci-lint v2. The default set (errcheck, govet, ineffassign, staticcheck, unused) plus a few
# linters that catch real bugs in network and file code.
version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - nolintlint
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        - G304 # file paths come from flags and the repository layout, not from users
        # Generated site data is public by nature and is read by other users on the server
        # (build user, nginx): 0755 directories and 0644 files are intended.
        - G301
        - G302
        - G306
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - (io.Closer).Close
        - os.Remove
        - (*database/sql.DB).Close
        - (*database/sql.Conn).Close
        - (*database/sql.Rows).Close
        - (*github.com/DenisHumen/krokosha-site/api/internal/cache.Cache).Close
        - (*github.com/DenisHumen/krokosha-site/api/internal/netmap.GeoIP).Close
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, noctx, errcheck]
      # The maintenance tool works with the files and directories its operator names in flags;
      # the API keeps the check, where a path could come from a request.
      - path: cmd/krokosha-cli/
        linters: [gosec]
        text: G703

formatters:
  enable:
    - gofmt
